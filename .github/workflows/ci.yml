name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux, deliberately. The shared package guards its two Apple-only
  # touch points (`os`, the App Group container) behind `canImport`, so a third
  # of the codebase is testable on an ordinary runner — no Mac, no minutes
  # multiplier, and a fast signal that survives whatever is happening with Xcode.
  #
  # It is also the check that would have caught `ColorValue` encoding as an
  # object while every content pack wrote a bare string: a defect no static
  # analysis found, and one that silently reduced the app to a single theme.
  shared-package-linux:
    name: Shared package (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: Packages/SunnieShared
        run: swift build
      - name: Test
        working-directory: Packages/SunnieShared
        run: swift test

  shared-package:
    name: Shared package (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: ./Tools/select_xcode.sh

      # The same package on Apple, where `os` and the App Group call are real
      # rather than compiled out. Linux proves the logic; this proves the guards
      # did not change behaviour on the platform that ships.
      - name: Test SunnieShared
        working-directory: Packages/SunnieShared
        run: swift test

  content:
    name: Content and configuration validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shipped content packs
        run: ./Scripts/validate-content.sh
      # Catches a permission requested without its Info.plist purpose string,
      # which iOS answers by terminating the process rather than by denying it.
      - name: Validate permission purpose strings
        run: python3 Tools/validate_permissions.py
      - name: Validate the creator audio manifest
        run: python3 Tools/validate_audio_manifest.py CreatorAudioSource/audio.manifest.json
      # Two resources with the same filename fail the build before any Swift is
      # compiled, so this Linux check costs seconds and saves a macOS run.
      - name: Validate bundle resource names
        run: python3 Tools/validate_bundle_resources.py
      # Missing imports surface one per build, each costing a macOS round trip.
      # This reports every one of them at once, on Linux, in a second.
      - name: Validate shared-package imports
        run: python3 Tools/validate_shared_imports.py
      # A localization key must be constant; only its default value may carry
      # arguments. Invisible without an Apple type checker, cheap to check here.
      - name: Validate localization keys
        run: python3 Tools/validate_localization_keys.py
      # A bundle missing a required key builds clean and is refused at install,
      # taking the whole app with it. No build catches this; this does.
      - name: Validate Info.plists
        run: python3 Tools/validate_info_plists.py

  # Syntax-only, on Linux. The app targets cannot be type-checked without an
  # Apple SDK, but they can be parsed — which catches malformed Swift that
  # brace-counting cannot see, on every push, with no Mac involved.
  parse-app-targets:
    name: Parse app targets (syntax only)
    runs-on: ubuntu-24.04
    container: swift:6.1.2
    steps:
      - uses: actions/checkout@v4
      - name: Parse
        run: ./Tools/parse_check.sh

  # The iPhone app, alone. The Watch build used to run first in this job, which
  # meant a missing watchOS SDK on the runner skipped the iPhone build entirely
  # — the one result the project most needs. They are separate jobs now so
  # neither can mask the other.
  build-and-test:
    name: Build and test (iPhone)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: ./Tools/select_xcode.sh

      # Destinations are discovered rather than hardcoded, so CI does not break
      # when the runner image changes its simulator lineup.
      - name: Discover an iPhone simulator
        id: destination
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No available iPhone simulator found')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      # The raw log is teed to a file before xcbeautify sees it. xcbeautify is
      # for reading in the browser; the raw log is the one that contains every
      # diagnostic in full, and on a target that has never compiled that
      # complete list is the entire point of running this.
      - name: Build and test the iPhone app
        run: |
          set -o pipefail
          xcodebuild test \
            -project SunnieDays.xcodeproj \
            -scheme SunnieDays \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-iphone.log | xcbeautify --renderer github-actions

      # Always, and deliberately: a failed build is the run worth reading.
      # Printed to stdout as well as the summary, and deliberately last: a full
      # xcodebuild log runs to five figures of lines, and log readers truncate.
      # Anything that matters has to be near the end to be legible at all.
      - name: Summarize diagnostics
        if: always()
        run: |
          [ -f xcodebuild-iphone.log ] || exit 0
          errors=$(grep -E "error: " xcodebuild-iphone.log \
            | sed 's|/Users/runner/work/sunnie/sunnie/||' | sort -u)
          count=$(printf '%s' "$errors" | grep -c . || true)

          echo "════════ $count distinct error(s) ════════"
          printf '%s\n' "$errors"
          echo "════════ end of errors ════════"

          {
            echo "### iPhone build: $count distinct error(s)"
            echo
            echo '```'
            printf '%s\n' "$errors" | head -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build
          path: |
            xcodebuild-iphone.log
            TestResults.xcresult
          if-no-files-found: ignore

  # Separate, and manual. The macos-15 image ships no watchOS SDK, so this has
  # to download several gigabytes before it can build anything — expensive on a
  # private repository, where macOS minutes bill at ten times the rate. The
  # iPhone app does not depend on it, so it runs when asked for rather than on
  # every push.
  build-watch:
    name: Build the Watch app
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: ./Tools/select_xcode.sh

      - name: Install the watchOS platform
        run: |
          set -o pipefail
          xcodebuild -downloadPlatform watchOS \
            || sudo xcodebuild -downloadPlatform watchOS

      - name: Build the Watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SunnieDays.xcodeproj \
            -scheme SunnieDaysWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-watch.log | xcbeautify --renderer github-actions

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-build
          path: xcodebuild-watch.log
          if-no-files-found: ignore
