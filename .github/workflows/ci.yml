name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux, deliberately. The shared package guards its two Apple-only
  # touch points (`os`, the App Group container) behind `canImport`, so a third
  # of the codebase is testable on an ordinary runner — no Mac, no minutes
  # multiplier, and a fast signal that survives whatever is happening with Xcode.
  #
  # It is also the check that would have caught `ColorValue` encoding as an
  # object while every content pack wrote a bare string: a defect no static
  # analysis found, and one that silently reduced the app to a single theme.
  shared-package-linux:
    name: Shared package (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        working-directory: Packages/SunnieShared
        run: swift build
      - name: Test
        working-directory: Packages/SunnieShared
        run: swift test

  shared-package:
    name: Shared package (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: ./Tools/select_xcode.sh

      # The same package on Apple, where `os` and the App Group call are real
      # rather than compiled out. Linux proves the logic; this proves the guards
      # did not change behaviour on the platform that ships.
      - name: Test SunnieShared
        working-directory: Packages/SunnieShared
        run: swift test

  content:
    name: Content and configuration validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shipped content packs
        run: ./Scripts/validate-content.sh
      # Catches a permission requested without its Info.plist purpose string,
      # which iOS answers by terminating the process rather than by denying it.
      - name: Validate permission purpose strings
        run: python3 Tools/validate_permissions.py
      - name: Validate the creator audio manifest
        run: python3 Tools/validate_audio_manifest.py CreatorAudioSource/audio.manifest.json
      # Two resources with the same filename fail the build before any Swift is
      # compiled, so this Linux check costs seconds and saves a macOS run.
      - name: Validate bundle resource names
        run: python3 Tools/validate_bundle_resources.py
      # Missing imports surface one per build, each costing a macOS round trip.
      # This reports every one of them at once, on Linux, in a second.
      - name: Validate shared-package imports
        run: python3 Tools/validate_shared_imports.py
      # A localization key must be constant; only its default value may carry
      # arguments. Invisible without an Apple type checker, cheap to check here.
      - name: Validate localization keys
        run: python3 Tools/validate_localization_keys.py
      # A bundle missing a required key builds clean and is refused at install,
      # taking the whole app with it. No build catches this; this does.
      - name: Validate Info.plists
        run: python3 Tools/validate_info_plists.py
      # A fixture read by one client looks exactly like a working contract —
      # green tests, a file full of intended behaviour — while constraining
      # nothing on the side that never opens it.
      - name: Validate contract coverage
        run: python3 Tools/validate_contract_coverage.py

  # The Kotlin half of the cross-language contracts (ADR-035).
  #
  # On Linux, and cheap, because the module it tests is deliberately plain
  # Kotlin with no Android dependency. That split is what lets this run on an
  # ordinary runner in seconds instead of needing the Android SDK — the same
  # reasoning as ADR-032, which pulled the shared Swift package off Apple so it
  # could be compiled without a Mac.
  #
  # It reads the fixture files under `Backend/contract` — the wire format for a
  # move, answer matching, replay, and turn order — which are the same bytes the
  # Swift suites read. Editing a fixture without updating both clients fails
  # here and in `Shared package`, which is the point: a divergence between the
  # iPhone and the Android phone becomes a red test rather than something that
  # only shows up mid-game, as a turn that silently does nothing or as two
  # players each waiting for the other.
  android-wire:
    name: Shared contracts (Kotlin)
    runs-on: ubuntu-24.04
    steps:
      # Pinned by digest like every other checkout in this file. Introducing a
      # tag-referenced action here would quietly weaken a supply-chain posture
      # the rest of the workflow keeps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `setup-java` step: ubuntu-24.04 ships Temurin 21 as its default JDK,
      # which is what `jvmToolchain(21)` asks for. Adding the action would mean
      # either an unpinned dependency or a second digest to keep current, for a
      # JDK the runner already has. If the image ever drops it, this job fails
      # loudly on a missing toolchain rather than doing something subtle.
      # Runs every contract suite in the module, not just the move wire
      # format: answer matching, replay, and turn order are all pinned by
      # fixtures under Backend/contract that the Swift jobs read too.
      - name: Test the shared contracts
        working-directory: Apps/Android
        run: ./gradlew --no-daemon --console=plain :wire:test

  # The Android APK.
  #
  # Separate from the contract job on purpose. That one runs on a plain JDK in
  # seconds and is the check worth having on every push; this one needs the
  # Android SDK and is slower, and a red X on it should mean "the app does not
  # build", not "the rules changed".
  #
  # The artifact is the point as much as the build is: the owner has no Mac and
  # no Android Studio, so a debug APK attached to the run is how the Android
  # client actually reaches a phone. Sideloading it needs no store listing and no
  # signing identity beyond the debug key AGP generates.
  android-app:
    name: Build the Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ANDROID_HOME is set on this image, which is what makes settings.gradle.kts
      # include `:app` at all. If a future image drops the SDK the module is
      # silently excluded rather than failing, so the presence of the APK is
      # checked below instead of being assumed.
      - name: Build the debug APK
        working-directory: Apps/Android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Check an APK was actually produced
        working-directory: Apps/Android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "No APK was produced. If :app was excluded for want of an SDK," \
                 "the build above would have succeeded while building nothing."
            exit 1
          fi
          echo "Built $apk ($(du -h "$apk" | cut -f1))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunnie-days-android-debug
          path: Apps/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Syntax-only, on Linux. The app targets cannot be type-checked without an
  # Apple SDK, but they can be parsed — which catches malformed Swift that
  # brace-counting cannot see, on every push, with no Mac involved.
  parse-app-targets:
    name: Parse app targets (syntax only)
    runs-on: ubuntu-24.04
    container: swift:6.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse
        run: ./Tools/parse_check.sh

  # The iPhone app, alone. The Watch build used to run first in this job, which
  # meant a missing watchOS SDK on the runner skipped the iPhone build entirely
  # — the one result the project most needs. They are separate jobs now so
  # neither can mask the other.
  build-and-test:
    name: Build and test (iPhone)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: ./Tools/select_xcode.sh

      # Destinations are discovered rather than hardcoded, so CI does not break
      # when the runner image changes its simulator lineup.
      - name: Discover an iPhone simulator
        id: destination
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No available iPhone simulator found')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      # The raw log is teed to a file before xcbeautify sees it. xcbeautify is
      # for reading in the browser; the raw log is the one that contains every
      # diagnostic in full, and on a target that has never compiled that
      # complete list is the entire point of running this.
      - name: Build and test the iPhone app
        run: |
          set -o pipefail
          xcodebuild test \
            -project SunnieDays.xcodeproj \
            -scheme SunnieDays \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-iphone.log | xcbeautify --renderer github-actions

      # Always, and deliberately: a failed build is the run worth reading.
      # Printed to stdout as well as the summary, and deliberately last: a full
      # xcodebuild log runs to five figures of lines, and log readers truncate.
      # Anything that matters has to be near the end to be legible at all.
      # Reports three separate things, because a run can fail in three ways and
      # the first version of this could only see one of them.
      #
      # It grepped for "error: " alone, and that was wrong twice over. Swift
      # Testing never writes "error:" — a failed `#expect` is an issue record —
      # so a red suite summarised as zero errors and the job failed with no
      # stated reason. And CoreData narrates a *recovered* store failure across
      # several hundred lines that all contain "error:", every one of them
      # harmless, which buried the handful that were not.
      - name: Summarize diagnostics
        if: always()
        run: |
          [ -f xcodebuild-iphone.log ] || exit 0

          # The store fails to open, CoreData recovers, and says so at length.
          # Filtering it is safe precisely because it always ends in "Recovery
          # attempt ... was successful".
          noise='CoreData: error:|component is (readable|writeable|not )|File (inode|Size|Device ID|user ID|group ID|Permissions)|Information for /|Device ID:|Executing as effective user|Logging status information|Failed to stat'

          # Every grep here is `|| true`, and every test is an `if`. This step
          # runs under `bash -e`, where a grep that matches nothing is a failure
          # that kills the step — so the diagnostics would vanish in exactly the
          # case they are written for: the run with no compile errors in it.
          # `error: -[` excluded: that is XCTest reporting a *runtime* failure in
          # a test case, which it formats with the same "error:" prefix a
          # compiler uses. Counted as a compile error it produced "3 compile
          # error(s)" for a build that compiled perfectly — and a compile error
          # and a failing test call for completely different responses.
          compile=$(grep -E "error: " xcodebuild-iphone.log 2>/dev/null \
            | grep -vE "$noise" \
            | grep -vE "error: -\[" \
            | sed 's|/Users/runner/work/sunnie/sunnie/||' | sort -u || true)
          compile_count=$(printf '%s' "$compile" | grep -c . || true)

          # XCTest says "error:"; Swift Testing says "recorded an issue". Both
          # are test failures and both belong here.
          # `error: -[` belongs here rather than with the compile errors: it is
          # XCTest reporting a runtime failure, and it is the line carrying the
          # *reason* — "Test Case ... failed" alone says only that something did.
          failures=$(grep -E "recorded an issue|✘ Test|Testing failed|Test Case .* failed|error: -\[" \
            xcodebuild-iphone.log 2>/dev/null \
            | sed 's|/Users/runner/work/sunnie/sunnie/||' | sort -u || true)
          failure_count=$(printf '%s' "$failures" | grep -c . || true)

          # The verdict lines, so a green run says so rather than saying nothing.
          verdict=$(grep -E "\*\* (TEST|BUILD) (FAILED|SUCCEEDED) \*\*|Executed [0-9]+ test|Test run with [0-9]+ test" \
            xcodebuild-iphone.log 2>/dev/null | sort -u | tail -20 || true)

          echo "════════ $compile_count compile error(s), $failure_count test failure(s) ════════"
          if [ "$compile_count" -gt 0 ]; then printf '%s\n' "$compile"; fi
          if [ "$failure_count" -gt 0 ]; then printf '%s\n' "$failures"; fi
          echo "──────── verdict ────────"
          printf '%s\n' "$verdict"
          echo "════════ end ════════"

          {
            echo "### iPhone: $compile_count compile error(s), $failure_count test failure(s)"
            echo
            if [ "$compile_count" -gt 0 ]; then
              echo "#### Compile errors"
              echo '```'
              printf '%s\n' "$compile" | head -150
              echo '```'
            fi
            if [ "$failure_count" -gt 0 ]; then
              echo "#### Test failures"
              echo '```'
              printf '%s\n' "$failures" | head -150
              echo '```'
            fi
            echo "#### Verdict"
            echo '```'
            printf '%s\n' "$verdict"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iphone-build
          path: |
            xcodebuild-iphone.log
            TestResults.xcresult
          if-no-files-found: ignore

  # Separate, and manual. The macos-15 image ships no watchOS SDK, so this has
  # to download several gigabytes before it can build anything — expensive on a
  # private repository, where macOS minutes bill at ten times the rate. The
  # iPhone app does not depend on it, so it runs when asked for rather than on
  # every push.
  build-watch:
    name: Build the Watch app
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: ./Tools/select_xcode.sh

      - name: Install the watchOS platform
        run: |
          set -o pipefail
          xcodebuild -downloadPlatform watchOS \
            || sudo xcodebuild -downloadPlatform watchOS

      - name: Build the Watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SunnieDays.xcodeproj \
            -scheme SunnieDaysWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-watch.log | xcbeautify --renderer github-actions

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-build
          path: xcodebuild-watch.log
          if-no-files-found: ignore
