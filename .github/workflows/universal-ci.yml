name: Universal Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Linux project types
        id: detect
        shell: bash
        run: |
          [ -f package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || true
          [ -f requirements.txt ] || [ -f pyproject.toml ] && echo "python=true" >> "$GITHUB_OUTPUT" || true
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || true
          [ -f go.mod ] && echo "go=true" >> "$GITHUB_OUTPUT" || true
          SWIFT_PACKAGE="$(find . -name Package.swift -type f -print -quit)"
          if [ -n "$SWIFT_PACKAGE" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "swift_package_dir=$(dirname "$SWIFT_PACKAGE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node install
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Node test
        if: steps.detect.outputs.node == 'true'
        run: npm test --if-present

      - name: Node lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Node build
        if: steps.detect.outputs.node == 'true'
        run: npm run build --if-present

      - name: Setup Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python dependencies
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Python tests
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest
          fi

      - name: Setup Rust
        if: steps.detect.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        if: steps.detect.outputs.rust == 'true'
        run: cargo test --all

      - name: Rust clippy
        if: steps.detect.outputs.rust == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Setup Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Go tests
        if: steps.detect.outputs.go == 'true'
        run: go test ./...

      - name: Swift package tests on Linux
        if: steps.detect.outputs.swift == 'true'
        run: swift test --package-path "${{ steps.detect.outputs.swift_package_dir }}"

      - name: Validate Sunnie project configuration
        run: |
          ./Scripts/validate-content.sh
          python3 Tools/validate_permissions.py
          python3 Tools/validate_audio_manifest.py CreatorAudioSource/audio.manifest.json
          python3 Tools/validate_bundle_resources.py
          python3 Tools/validate_shared_imports.py
          python3 Tools/validate_localization_keys.py
          python3 Tools/validate_info_plists.py
          python3 Tools/validate_xcode_dependencies.py
          ./Tools/parse_check.sh

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.detect.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        if: steps.detect.outputs.android == 'true'
        run: chmod +x ./gradlew

      - name: Android build
        if: steps.detect.outputs.android == 'true'
        run: ./gradlew build

      - name: Android tests
        if: steps.detect.outputs.android == 'true'
        run: ./gradlew test

      - name: Android lint
        if: steps.detect.outputs.android == 'true'
        run: ./gradlew lint

      - name: Upload Android outputs
        if: always() && steps.detect.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
            **/build/reports/**
          if-no-files-found: ignore

  apple:
    name: Apple iOS/macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Apple project
        id: detect
        shell: bash
        run: |
          PROJECT="$(find . -name '*.xcodeproj' -type d -print -quit)"
          # An .xcodeproj contains an internal project.xcworkspace. It is an
          # implementation detail, not a workspace the workflow should select.
          WORKSPACE="$(find . -name '*.xcworkspace' -type d \
            -not -path '*.xcodeproj/*' -print -quit)"

          if [ -n "$WORKSPACE" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT" ]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

          SWIFT_PACKAGE="$(find . -name Package.swift -type f -print -quit)"
          if [ -n "$SWIFT_PACKAGE" ]; then
            echo "swift_package=true" >> "$GITHUB_OUTPUT"
            echo "swift_package_dir=$(dirname "$SWIFT_PACKAGE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Select project Xcode version
        if: steps.detect.outputs.kind != 'none'
        run: ./Tools/select_xcode.sh

      - name: Show Xcode environment
        if: steps.detect.outputs.kind != 'none'
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Swift package tests
        if: steps.detect.outputs.swift_package == 'true'
        run: swift test --package-path "${{ steps.detect.outputs.swift_package_dir }}"

      - name: Discover shared scheme
        id: scheme
        if: steps.detect.outputs.kind != 'none'
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.kind }}" = "workspace" ]; then
            JSON="$(xcodebuild -workspace "${{ steps.detect.outputs.path }}" -list -json)"
          else
            JSON="$(xcodebuild -project "${{ steps.detect.outputs.path }}" -list -json)"
          fi

          SCHEME="$(printf '%s' "$JSON" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          root = next(iter(data.values()))
          schemes = root.get("schemes", [])
          print("SunnieDays" if "SunnieDays" in schemes else (schemes[0] if schemes else ""))
          ')"

          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Resolve local Swift packages
        if: steps.detect.outputs.kind != 'none' && steps.scheme.outputs.name != ''
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.kind }}" = "workspace" ]; then
            TARGET=(-workspace "${{ steps.detect.outputs.path }}")
          else
            TARGET=(-project "${{ steps.detect.outputs.path }}")
          fi
          xcodebuild -resolvePackageDependencies \
            "${TARGET[@]}" \
            -scheme "${{ steps.scheme.outputs.name }}"

      - name: Build widget extension directly
        if: steps.detect.outputs.kind == 'project'
        run: |
          xcodebuild build \
            -project "${{ steps.detect.outputs.path }}" \
            -target SunnieWidgets \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Simulator target
        if: steps.detect.outputs.kind != 'none' && steps.scheme.outputs.name != ''
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.kind }}" = "workspace" ]; then
            TARGET=(-workspace "${{ steps.detect.outputs.path }}")
          else
            TARGET=(-project "${{ steps.detect.outputs.path }}")
          fi

          xcodebuild \
            "${TARGET[@]}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS Simulator tests
        if: steps.detect.outputs.kind != 'none' && steps.scheme.outputs.name != ''
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.kind }}" = "workspace" ]; then
            TARGET=(-workspace "${{ steps.detect.outputs.path }}")
          else
            TARGET=(-project "${{ steps.detect.outputs.path }}")
          fi

          DEVICE="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit
          ')"

          if [ -z "$DEVICE" ]; then
            echo "No available iPhone Simulator was found."
            exit 1
          fi

          xcodebuild \
            "${TARGET[@]}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            test

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Windows/.NET project
        id: detect
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1

          if ($solution -or $project) {
            "dotnet=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Setup .NET
        if: steps.detect.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore and build
        if: steps.detect.outputs.dotnet == 'true'
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1

          if ($solution) {
            dotnet restore $solution.FullName
            dotnet build $solution.FullName --configuration Release --no-restore
          }
          else {
            Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
              dotnet restore $_.FullName
              dotnet build $_.FullName --configuration Release --no-restore
            }
          }

      - name: Run .NET tests
        if: steps.detect.outputs.dotnet == 'true'
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter *.csproj | Where-Object {
            Select-String -Path $_.FullName -Pattern 'Microsoft.NET.Test.Sdk' -Quiet
          }

          foreach ($test in $tests) {
            dotnet test $test.FullName --configuration Release
          }

  binary-preflight:
    name: Binary preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report changed binary files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable comparison base for this event."
            exit 0
          fi

          git diff --numstat "$BASE" HEAD | awk '
            $1 == "-" || $2 == "-" {
              print "Binary change:", $3
            }
          '
