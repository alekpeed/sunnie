org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

# Required by every AndroidX dependency, which for a Compose app is all of them.
# Without it `:app:checkDebugAarMetadata` refuses the build outright rather than
# warning, so this is not a preference.
android.useAndroidX=true
